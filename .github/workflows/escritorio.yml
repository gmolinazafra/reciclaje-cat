# Compila el instalador de Windows de ReciclaCat_Gest (.exe) en un equipo Windows de GitHub.
# - Al subir cambios: instalador de prueba en «Artifacts».
# - Al crear una etiqueta vX.Y.Z (igual a la versión de escritorio/package.json): se publica como versión
#   en GitHub Releases y los programas instalados se actualizan solos.
name: Instalador Windows

on:
  workflow_dispatch:
  push:
    branches: [feature/reciclacat-gest-v2, main]
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias de la app
        run: npm install --no-audit --no-fund

      - name: Pruebas
        run: npm test

      - name: Compilar la app (exportación estática)
        run: npm run build

      - name: Preparar la carpeta del programa
        run: npm run escritorio:preparar

      - name: Instalar Electron y electron-builder
        working-directory: escritorio
        run: npm install --no-audit --no-fund

      - name: Crear instalador .exe (prueba)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: escritorio
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run instalador

      - name: Crear y publicar la versión (actualización automática)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: escritorio
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publicar

      - name: Guardar el instalador
        uses: actions/upload-artifact@v4
        with:
          name: ReciclaCat_Gest-instalador
          path: escritorio/dist/*.exe
          retention-days: 30
